name: Quality

# The judicious cadence. The ratchet lanes each recompile the workspace, and the
# coverage conduct additionally runs the whole black-box suite a second time
# under instrumentation — minutes, not seconds. A floor does not need per-commit
# sampling to do its job: one nightly conduct holds it, and a red morning
# bisects one day of commits. Manual dispatch covers "I want the number now".
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

env:
  PROVA_VERSION: v0.24.0
  PROVA_SHA256: a194ed4f64d2cb9b78257037e5f279d85512602ce7769c88aa269b2c1c88aebc

jobs:
  quality:
    name: The whole bar (ratcheted)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Enable Rust dependency caching
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Install prova
        run: |
          set -euo pipefail
          archive="prova-${PROVA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSLO "https://github.com/prova-rs/prova/releases/download/${PROVA_VERSION}/${archive}"
          echo "${PROVA_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "${archive}"
          install -m 0755 "prova-${PROVA_VERSION}-linux-x86_64/prova" /usr/local/bin/prova
          prova --version

      - name: Build
        run: cargo build

      # Everything: the proofs, the unit tests, the debt ratchets, and layered
      # coverage against its floors — one exit code.
      #
      # FIRST RUN CAVEAT: the committed baselines in .prova/baselines/ were
      # banked on macOS/aarch64. Platform-conditional code means the clippy and
      # coverage numbers can differ here by a little. If this job's first run is
      # red on a ratchet rather than on a proof, read the printed worklist, then
      # re-bank deliberately with `prova run release --update-baseline` on a
      # Linux runner and commit the result — never by loosening the file to make
      # a red gate green.
      - name: Prove the whole bar
        run: prova run release
